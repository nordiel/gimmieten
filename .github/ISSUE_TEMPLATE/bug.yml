name: Bug
description: Something is broken or behaves wrong
labels: ["type: bug"]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1. 
        2. 
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser, device, language
      placeholder: Safari 19, iPhone 16, Español
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console errors
